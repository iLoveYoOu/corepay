<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArtAuto Remote</title><link rel="stylesheet" href="/remote/style.css"></head><body><main><h1>ArtAuto Remote</h1><p id="status">Entre para conectar ao celular.</p><form id="login"><label>Login<input name="username" value="Admin" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><section id="controls" hidden><nav><button id="pair">Parear celular</button><button id="disconnect">Desativar acesso</button><button id="logout">Sair</button></nav><p id="code"></p><img id="screen" alt="Tela do celular" draggable="false"><nav><button data-action="back">Voltar</button><button data-action="home">Início</button><button data-action="recents">Recentes</button></nav><form id="typing"><input name="text" placeholder="Texto para o campo selecionado" autocomplete="off"><button>Inserir texto</button></form></section></main><script src="/remote/panel.js"></script></body></html>
